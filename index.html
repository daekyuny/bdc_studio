<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burndown Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orbit"></div>
    <div class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Sprint Burndown</p>
          <h1>Burndown Studio</h1>
        </div>
        <div class="header-actions">
          <button class="btn ghost" id="exportBtn">Export</button>
          <button class="btn ghost" id="importBtn">Import</button>
          <input type="file" id="importFile" accept=".json" hidden />
          <button class="btn ghost danger" id="deleteSprintBtn">Delete Sprint</button>
          <button class="btn" id="newSprintBtn">New Sprint</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sprint-list" id="sprintList"></aside>

        <section class="content">
          <div class="sprint-title-bar">
            <p class="sprint-title-text" id="sprintTitleText">Sprint 1</p>
          </div>

          <div class="info-row">
            <div class="card" id="statsCard">
              <div class="summary-list">
                <div class="summary-row">
                  <span class="summary-label">Duration</span>
                  <span class="summary-value" id="summaryDuration">—</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">Working Days</span>
                  <span class="summary-value" id="workingDays">0</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">Total Points</span>
                  <span class="summary-value" id="totalPoints">0</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">Remaining</span>
                  <span class="summary-value" id="remainingPoints">0</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">Done Tasks</span>
                  <span class="summary-value" id="doneTasks">0</span>
                </div>
                <div class="summary-row" id="availableDays">
                  <span class="summary-label">Available Days</span>
                  <span class="summary-value" id="availableDaysValue">0</span>
                </div>
              </div>
              <div class="summary-footer">
                <button class="btn ghost small" id="editSprintBtn">Edit Sprint</button>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h2>Burndown</h2>
                <div class="toggle">
                  <input type="checkbox" id="showDayNumbers" checked />
                  <label for="showDayNumbers">Show day numbers</label>
                </div>
                <div class="legend">
                  <span class="legend-item">
                    <span class="swatch ideal"></span>Ideal
                  </span>
                  <span class="legend-item">
                    <span class="swatch actual"></span>Actual
                  </span>
                </div>
              </div>
              <div class="chart-wrap">
                <svg id="burndownChart" viewBox="0 0 800 320" role="img"></svg>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Tasks</h2>
              <div class="today-field">
                <label for="sprintToday">Today</label>
                <input type="date" id="sprintToday" />
              </div>
              <button class="btn ghost" id="addTaskBtn">Add Task</button>
            </div>
            <div class="task-table-wrap">
              <table class="task-table">
                <thead>
                  <tr>
                    <th class="col-task">Task</th>
                    <th class="col-points">Days</th>
                    <th class="col-status">Status</th>
                    <th class="col-done">Done Date</th>
                    <th class="col-actions"></th>
                  </tr>
                </thead>
                <tbody id="taskRows"></tbody>
              </table>
            </div>
          </div>

        </section>
      </main>
    </div>

    <!-- Sprint edit/create modal -->
    <div class="modal-overlay" id="sprintModal" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Edit Sprint</h3>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-error" id="modalError" hidden></div>
          <label>
            Description (optional)
            <input type="text" id="modalDescription" placeholder="e.g. User auth, payment flow" />
          </label>
          <label>
            <span class="label-row">Start Date <span id="modalWorkingDays" class="working-days-chip"></span></span>
            <input type="date" id="modalStartDate" />
          </label>
          <label>
            End Date
            <input type="date" id="modalEndDate" />
          </label>
          <label>
            Developers
            <input type="number" id="modalDevelopers" min="1" step="1" />
          </label>
          <label>
            Efficiency (0–1)
            <input type="number" id="modalEfficiency" min="0" max="1" step="0.05" />
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn ghost" id="modalCancel">Cancel</button>
          <button class="btn" id="modalSave">Save</button>
        </div>
      </div>
    </div>

    <template id="sprintItemTemplate">
      <button class="sprint-item">
        <span class="sprint-label"></span>
      </button>
    </template>

    <template id="taskRowTemplate">
      <tr class="task-row">
        <td class="col-task">
          <input class="task-name" type="text" placeholder="Task name" />
        </td>
        <td class="col-points">
          <input class="task-points" type="number" min="0" step="0.5" placeholder="0" />
        </td>
        <td class="col-status">
          <select class="task-status">
            <option value="Todo">Todo</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </td>
        <td class="col-done">
          <input class="task-done" type="date" />
        </td>
        <td class="col-actions">
          <button class="btn ghost small task-delete">Remove</button>
        </td>
      </tr>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
